name: Debug room submission
on:
  push:
    branches: [feature/nexconn-debug-rooms]
    paths: ['integrations/debug-room/**', '.github/workflows/debug-rooms.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: integrations/debug-room
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - run: npm run build && npm test
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify the disconnected flow in Chromium
        run: |
          python -m pip install playwright==1.62.0
          python -m playwright install --with-deps chromium
          data="$(mktemp -d)"
          HOST=127.0.0.1 ROOM_DATA_DIR="$data" node server.mjs >"$data/server.log" 2>&1 &
          service=$!
          trap 'cat "$data/server.log"; kill "$service" 2>/dev/null || true' EXIT
          curl --fail --silent --show-error --retry 15 --retry-connrefused --retry-delay 1 http://127.0.0.1:4174/api/sample >/dev/null
          python test/browser_flow.py
      - name: Pack standalone room with the official browser SDK
        run: |
          mkdir -p "$RUNNER_TEMP/package"
          cp -r public fixture test api "$RUNNER_TEMP/package/"
          cp *.mjs *.json *.md .env.example .dockerignore .gitignore Dockerfile "$RUNNER_TEMP/package/"
          cp submission.pdf submission.html "$RUNNER_TEMP/package/"
      - uses: actions/upload-artifact@v4
        with:
          name: forze-debug-room
          path: ${{ runner.temp }}/package/
          include-hidden-files: true
          retention-days: 14
