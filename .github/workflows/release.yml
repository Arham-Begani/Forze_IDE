name: Release IDE

# Tag a release to trigger:  git tag v0.1.1 && git push origin v0.1.1
on:
  push:
    tags: ['v*']

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: ''
          - os: macos-latest
            args: '--target universal-apple-darwin'
          - os: ubuntu-22.04
            args: ''
    runs-on: ${{ matrix.os }}
    # The Tauri app lives in the pnpm workspace, not the git root.
    defaults:
      run:
        working-directory: forze-suite
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: forze-suite/pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Cache cargo
        uses: swatinem/rust-cache@v2
        with:
          workspaces: forze-suite/apps/desktop/src-tauri

      - name: Linux deps
        if: matrix.os == 'ubuntu-22.04'
        working-directory: .
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install workspace deps
        run: pnpm install --frozen-lockfile

      # Windows Authenticode signing (Azure Trusted Signing) only engages when the
      # service-principal secret is present. Until you provision Azure + add the
      # secrets, this resolves to an empty arg and the build is byte-for-byte what
      # it is today (unsigned) — so adding this step can never break a release.
      - name: Resolve Authenticode signing (Windows)
        id: codesign
        shell: bash
        env:
          HAS_AZURE: ${{ secrets.AZURE_CLIENT_ID != '' }}
        run: |
          if [ "${{ matrix.os }}" = "windows-latest" ] && [ "$HAS_AZURE" = "true" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "config=--config src-tauri/tauri.signing.conf.json" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "config=" >> "$GITHUB_OUTPUT"
          fi

      # signCommand in tauri.signing.conf.json shells out to this during bundling,
      # so BOTH the app .exe and the installer get Authenticode-signed.
      - name: Install Trusted Signing CLI
        if: steps.codesign.outputs.enabled == 'true'
        run: cargo install trusted-signing-cli --locked

      # Two unrelated signatures happen here — do not confuse them:
      #   • TAURI_SIGNING_*  → minisign keys that sign the auto-UPDATER manifest
      #     so the updater can verify downloads. This does NOTHING for SmartScreen.
      #   • AZURE_* + codesign.config → Windows AUTHENTICODE signing via Azure
      #     Trusted Signing. THIS is what removes the SmartScreen warning.
      - name: Build + sign
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Authenticode signing via Azure Trusted Signing (read by trusted-signing-cli
          # through the Azure DefaultAzureCredential chain). Unset → signing is skipped.
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          # Build-time (Vite inlines these into the bundle). Without them the
          # released app shows "Forze account isn't configured for this build".
          # The anon key is meant to ship in the binary — RLS is the boundary.
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          # Optional built-in integrations (safe to leave unset).
          VITE_FORZE_GEMINI_KEY: ${{ secrets.VITE_FORZE_GEMINI_KEY }}
          VITE_FORZE_VERCEL_TOKEN: ${{ secrets.VITE_FORZE_VERCEL_TOKEN }}
          VITE_FORZE_VERCEL_TEAM_ID: ${{ secrets.VITE_FORZE_VERCEL_TEAM_ID }}
          # "Connect LinkedIn" in Build in Public. Baked into the Rust binary by
          # build.rs (NOT the webview) so the client secret can do the token
          # exchange. Unset → the app just reports LinkedIn as unconfigured.
          LINKEDIN_CLIENT_ID: ${{ secrets.LINKEDIN_CLIENT_ID }}
          LINKEDIN_CLIENT_SECRET: ${{ secrets.LINKEDIN_CLIENT_SECRET }}
        run: pnpm --filter @forze/desktop exec tauri build ${{ matrix.args }} ${{ steps.codesign.outputs.config }}

      - uses: actions/upload-artifact@v4
        with:
          name: bundle-${{ matrix.os }}
          # Bundle output lives under the desktop crate's target dir.
          path: forze-suite/apps/desktop/src-tauri/target/**/bundle/**/*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - run: npm install --no-save @vercel/blob
      - name: Upload to Blob + write manifest
        env:
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
          RELEASE_VERSION: ${{ github.ref_name }}
        run: node scripts/publish-release.mjs
